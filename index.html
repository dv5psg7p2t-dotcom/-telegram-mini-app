<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #111;
    }

    .app {
      max-width: 500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 18px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    .balance {
      margin: 25px 0;
      padding: 22px;
      border-radius: 20px;
      background: #111;
      color: white;
    }

    .balance-title {
      font-size: 14px;
      opacity: 0.7;
    }

    .balance-value {
      font-size: 36px;
      font-weight: bold;
      margin-top: 8px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #2481cc;
      color: white;
    }

    button.secondary {
      background: #eee;
      color: #111;
    }

    #result {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">
  <div class="card">

    <h1>🚀 Telegram Mini App</h1>

    <p>
      Добро пожаловать! Это первая версия нашего Mini App.
    </p>

    <div class="balance">
      <div class="balance-title">Ваш баланс</div>
      <div class="balance-value">
        <span id="balance">0</span> ⭐
      </div>
    </div>

    <button onclick="earn()">
      💰 Заработать 10 ⭐
    </button>

    <button class="secondary" onclick="showUser()">
      👤 Мой профиль
    </button>

    <div id="result"></div>

  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  let balance = 0;

  function earn() {
    balance += 10;

    document.getElementById("balance").textContent = balance;

    document.getElementById("result").textContent =
      "🎉 Вы получили 10 ⭐!";
  }

  function showUser() {
    const user = tg.initDataUnsafe?.user;

    if (user) {
      document.getElementById("result").textContent =
        "👋 Привет, " + (user.first_name || "пользователь") + "!";
    } else {
      document.getElementById("result").textContent =
        "Открой приложение через Telegram.";
    }
  }
</script>

</body>
</html>
